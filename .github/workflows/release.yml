name: Release

# Pousser un tag vX.Y.Z (ex. v1.1.1) compile l'installeur macOS (.dmg universel Intel + Apple Silicon)
# et l'installeur Windows (.exe NSIS), puis les publie dans une Release GitHub.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Pas de certificat Apple Developer : signature ad-hoc, obligatoire pour que l'app
            # se lance sur Apple Silicon. Gatekeeper demandera une validation au premier lancement.
            args: --mac dmg --universal -c.mac.identity=-
          - os: windows-latest
            args: --win nsis --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
